# Bello vendor database (own, curated; Apache-2.0).
# Researched from public vendor documentation and observed behaviour of the services.
# Nothing is copied from DuckDuckGo Tracker Radar or other NonCommercial/copyleft lists.
#
# Schema per vendor:
#   id                    stable lowercase id
#   name                  company (and product)
#   country               ISO 3166-1 alpha-2 country of the company seat
#   thirdCountry          optional override; default: country is outside the EU/EEA
#   category              werbung | analyse | video | karten | fonts | cdn | zahlung | bot-schutz
#                         | social | tag-manager | cmp | chat | sonstiges
#   hosts                 host globs (`*.x.com` also matches x.com); most specific pattern wins
#   cookies               cookie name globs; `name@hostglob` restricts to a cookie domain
#   storageKeys           localStorage/sessionStorage key globs
#   necessaryCookies      cookie globs that are technically necessary (bot protection, load
#                         balancing, CSRF, payment fraud prevention) -> INFO, not tracking.
#                         Every other cookie/storage match of a non-CMP vendor counts as tracking,
#                         whatever the vendor category (e.g. YouTube VISITOR_INFO1_LIVE).
#   necessaryStorageKeys  same for localStorage/sessionStorage keys
#   privacyPolicyAliases  names under which the service is usually named in a Datenschutzerklaerung
#   fix                   German recommendation (category default is used when omitted)
#   isCmp                 true for consent managers; their cookies/keys are consent state (necessary)
version: 1
vendors:
